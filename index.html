<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="description" content="Wedding invitation of Venkat and Sowmya">
<meta property="og:title" content="Venkat & Sowmya, Wedding Invitation">
<title>Subhalekha Wedding Invitation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gilda+Display&family=Hanken+Grotesk:wght@400;500;600&family=Noto+Sans+Devanagari:wght@600&family=Noto+Sans+Telugu:wght@400;500;600&family=Noto+Serif+Telugu:wght@500;700&display=swap">
<style>
  /* Layout: a sequence of full-width "scenes". Dark maroon scenes (hero, story, pre-wedding,
     closing) alternate with light ones, joined by hanging toran scallops. Gold marks the
     auspicious moment (Muhurtham). Illustrations are inline SVG built in the script below. */
  :root {
    --hero: #6A0F22;
    --hero-deep: #4C0A18;
    --hero-glow: #8A1830;
    --on-hero: #F8E9D2;
    --gold: #E3B955;
    --gold-ink: #8A5F00;
    --marigold: #F2A31B;
    --marigold-deep: #C9700B;
    --leaf: #4C8040;
    --bg: #FBF7F4;
    --wash: #F5E7DB;
    --surface: #FFFFFF;
    --fg: #2B1519;
    --muted: #6E5459;
    --rule: #E6D8CF;
    --ph-a: #F3E3D8;
    --ph-b: #E9CBB4;
    --focus: #B3122B;
    --f-display: 'Gilda Display', 'Noto Serif Telugu', Georgia, serif;
    --f-body: 'Hanken Grotesk', 'Noto Sans Telugu', system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --hero: #4A0B18; --hero-deep: #34070F; --hero-glow: #66132A;
      --gold-ink: #E3B955; --leaf: #7FB07A;
      --bg: #170A0E; --wash: #1F0F14; --surface: #2A141B; --fg: #F4E8DA; --muted: #BFA79C; --rule: #3A2229;
      --ph-a: #34181F; --ph-b: #261016; --focus: #F0A0AE;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --hero: #4A0B18; --hero-deep: #34070F; --hero-glow: #66132A;
    --gold-ink: #E3B955; --leaf: #7FB07A;
    --bg: #170A0E; --wash: #1F0F14; --surface: #2A141B; --fg: #F4E8DA; --muted: #BFA79C; --rule: #3A2229;
    --ph-a: #34181F; --ph-b: #261016; --focus: #F0A0AE;
    color-scheme: dark;
  }
  html[data-lang="te"] {
    --f-display: 'Noto Serif Telugu', 'Gilda Display', Georgia, serif;
    --f-body: 'Noto Sans Telugu', 'Hanken Grotesk', system-ui, sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 16px; line-height: 1.6; overflow-x: hidden; }
  html[data-lang="te"] body { line-height: 1.85; }
  body::before {
    content: ""; position: fixed; inset: 0 0 auto; z-index: 40;
    height: env(safe-area-inset-top, 0px); background: var(--hero-deep);
  }
  h1, h2, h3, p, ul, dl, dd, figure, address { margin: 0; padding: 0; }
  ul { list-style: none; }
  address { font-style: normal; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
  svg { display: block; }

  .wrap {
    max-width: 720px; margin-inline: auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .f-gold { fill: var(--gold); } .f-mar { fill: var(--marigold); } .f-mard { fill: var(--marigold-deep); } .f-leaf { fill: var(--leaf); }
  .s-gold { stroke: var(--gold); }

  /* ---------- Header ---------- */
  .top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--hero-deep); color: var(--on-hero); }
  .top-in { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 8px 4px; }
  .mono { font-family: var(--f-display); font-size: 1.15rem; letter-spacing: .08em; color: var(--gold); }
  .lang { display: flex; border: 1px solid rgba(227,185,85,.55); border-radius: 999px; overflow: hidden; }
  .lang button { font-size: .85rem; font-weight: 600; line-height: 1.2; padding: 7px 14px; border: 0; background: transparent; color: var(--on-hero); cursor: pointer; }
  .lang button[aria-pressed="true"] { background: var(--gold); color: var(--hero-deep); }
  .nav { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-block: 4px 9px; }
  .nav::-webkit-scrollbar { display: none; }
  .nav button { flex: 0 0 auto; border: 1px solid transparent; background: transparent; color: rgba(248,233,210,.8); font-size: .85rem; font-weight: 500; padding: 5px 13px; border-radius: 999px; cursor: pointer; }
  .nav button[aria-current="true"] { border-color: var(--gold); color: var(--gold); }

  /* ---------- Scenes ---------- */
  .scene { position: relative; scroll-margin-top: 96px; }
  .pad { padding-block: 76px 84px; }
  .dark { background: var(--hero-deep); color: var(--on-hero); }
  .wash { background: var(--wash); }
  .scallop::after {
    content: ""; position: absolute; left: 0; right: 0; top: 100%; height: 14px; z-index: 3; pointer-events: none;
    background: radial-gradient(circle at 50% 0, var(--sc) 0 8.5px, transparent 9px) 0 0 / 22px 14px repeat-x;
  }
  .eyebrow { font-size: .78rem; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: var(--gold-ink); }
  .dark .eyebrow { color: var(--gold); }
  html[data-lang="te"] .eyebrow { letter-spacing: 0; text-transform: none; font-size: .95rem; }
  h2 { font-family: var(--f-display); font-weight: 400; font-size: clamp(2rem, 7vw, 2.8rem); line-height: 1.15; margin: 6px 0 14px; text-wrap: balance; }
  html[data-lang="te"] h2 { font-weight: 700; line-height: 1.4; font-size: clamp(1.7rem, 6vw, 2.3rem); }
  .lede { color: var(--muted); max-width: 46ch; }
  .dark .lede { color: rgba(248,233,210,.8); }
  .head-c { text-align: center; }
  .head-c .lede { margin-inline: auto; }
  .orn { display: flex; align-items: center; justify-content: center; gap: 12px; margin-block: 18px; color: var(--gold-ink); }
  .dark .orn { color: var(--gold); }
  .orn::before, .orn::after { content: ""; flex: 0 1 90px; height: 1px; background: currentColor; opacity: .55; }
  .orn svg { width: 30px; height: 30px; }

  /* ---------- Hero ---------- */
  .hero { color: var(--on-hero); text-align: center; --sc: var(--hero); background: radial-gradient(ellipse at 50% 38%, var(--hero-glow) 0, transparent 66%), var(--hero); scroll-margin-top: 0; }
  .toran { position: absolute; top: 0; left: 0; right: 0; z-index: 2; max-width: 900px; margin-inline: auto; pointer-events: none; }
  .toran svg { width: 100%; height: auto; }
  .mandala-bg { position: absolute; inset: 0; overflow: hidden; display: grid; place-items: center; pointer-events: none; }
  .mandala-bg svg { width: min(760px, 170vw); height: auto; color: var(--gold); opacity: .2; animation: spin 180s linear infinite; }
  .petals { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
  .petals span { position: absolute; top: -30px; width: var(--s); height: calc(var(--s) * 1.45); border-radius: 60% 40% 60% 40%; background: linear-gradient(140deg, var(--marigold), var(--marigold-deep)); opacity: .85; animation: fall var(--d) linear var(--dl) infinite; }
  .hero-in { position: relative; z-index: 1; padding-block: 92px 92px; }
  .invoc { color: var(--gold); font-size: .95rem; font-weight: 500; letter-spacing: .1em; }
  .lead { max-width: 34ch; margin: 18px auto 26px; opacity: .9; }
  .names { display: flex; flex-direction: column; align-items: center; font-family: var(--f-display); font-weight: 400; }
  .names .n { font-size: clamp(2.9rem, 13vw, 6rem); line-height: 1.02; overflow-wrap: anywhere; }
  .names .amp { font-size: 2rem; line-height: 1.5; color: var(--gold); }
  html[data-lang="te"] .names { font-weight: 700; }
  html[data-lang="te"] .names .n { font-size: clamp(2.8rem, 12vw, 5.2rem); line-height: 1.3; }
  .daterow { display: flex; align-items: flex-end; justify-content: center; gap: 14px; margin-top: 30px; }
  .daterow .diya { width: 44px; flex: 0 0 auto; }
  .when { padding: 12px 6px; border-block: 1px solid rgba(227,185,85,.6); letter-spacing: .05em; font-weight: 500; min-width: 0; }
  .ctas { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 30px; }
  @media (prefers-reduced-motion: no-preference) {
    .hero-in > * { animation: rise .9s cubic-bezier(.2,.7,.2,1) both; }
    .hero-in > :nth-child(2) { animation-delay: .08s; } .hero-in > :nth-child(3) { animation-delay: .16s; }
    .hero-in > :nth-child(4) { animation-delay: .26s; } .hero-in > :nth-child(5) { animation-delay: .34s; }
    .hero-in > :nth-child(6) { animation-delay: .42s; }
  }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes fall { from { transform: translate3d(0, 0, 0) rotate(0); } to { transform: translate3d(var(--x), 1100px, 0) rotate(420deg); } }
  @keyframes flick { from { transform: scale(1, 1) skewX(0); } to { transform: scale(.92, 1.08) skewX(3deg); } }
  @keyframes twinkle { from { opacity: .35; } to { opacity: 1; } }
  .flame { transform-box: fill-box; transform-origin: 50% 100%; animation: flick 1.1s ease-in-out infinite alternate; }
  .bulb { animation: twinkle 1.6s ease-in-out infinite alternate; }

  /* ---------- Buttons ---------- */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600; font-size: .95rem; line-height: 1.3; text-align: center; text-decoration: none; padding: 12px 20px; border-radius: 999px; cursor: pointer; background: var(--gold); color: #3E0912; border: 1px solid var(--gold); transition: transform .15s ease; }
  .btn:hover { transform: translateY(-1px); }
  .btn.ghost { background: transparent; color: var(--on-hero); border-color: rgba(227,185,85,.7); }
  .btn.solid { background: var(--hero); color: var(--on-hero); border-color: var(--gold-ink); }
  .btn.line { background: transparent; color: var(--fg); border-color: var(--gold-ink); }

  /* ---------- Photo slots ---------- */
  .slot { position: relative; width: 100%; height: 100%; overflow: hidden; background: linear-gradient(155deg, var(--ph-a), var(--ph-b)); }
  .slot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .slot .ph { position: absolute; inset: 0; display: grid; place-items: center; color: var(--gold-ink); }
  .slot .ph > svg { width: 100%; height: 100%; }
  .addp, .rm { position: absolute; z-index: 2; cursor: pointer; }
  .addp { left: 50%; bottom: 10px; transform: translateX(-50%); white-space: nowrap; background: rgba(42,10,18,.82); color: #fff; font-size: .78rem; font-weight: 600; padding: 6px 12px; border-radius: 999px; }
  .addp input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; font-size: 0; }
  .addp:focus-within { outline: 2px solid var(--focus); outline-offset: 2px; }
  .rm { top: 8px; right: 8px; width: 28px; height: 28px; border-radius: 50%; border: 0; background: rgba(42,10,18,.78); color: #fff; font-size: 1.1rem; line-height: 1; }

  /* ---------- Intro ---------- */
  .intro-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 36px; justify-items: center; text-align: center; }
  .arch { width: min(270px, 78%); aspect-ratio: 4 / 5; border-radius: 999px 999px 6px 6px; overflow: hidden; position: relative; border: 3px solid var(--gold); padding: 6px; background: var(--surface); }
  .arch > .slot { border-radius: 999px 999px 2px 2px; }
  .cap { margin-top: 12px; color: var(--muted); font-size: .92rem; font-family: var(--f-display); }

  /* ---------- Couple ---------- */
  .pair { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 290px), 1fr)); gap: 20px; margin-top: 34px; }
  .duo { display: grid; justify-items: center; gap: 26px; margin-top: 34px; }
  .arch.wide { width: min(560px, 100%); aspect-ratio: 4 / 3; border-radius: 16px; padding: 5px; }
  .arch.wide > .slot { border-radius: 11px; }
  .duo-names { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
  @media (min-width: 560px) { .duo-names { flex-direction: row; gap: 28px; } }
  .duo-names .role { margin-top: 0; }
  .duo-names .amp { font-family: var(--f-display); font-size: 2rem; color: var(--gold-ink); line-height: 1; }
  .person { background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 26px 22px 24px; text-align: center; min-width: 0; }
  .person .arch { width: min(200px, 70%); margin-inline: auto; }
  .role { margin-top: 18px; font-size: .78rem; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--gold-ink); }
  html[data-lang="te"] .role { letter-spacing: 0; text-transform: none; font-size: .95rem; }
  .who { font-family: var(--f-display); font-size: 1.9rem; line-height: 1.2; margin-top: 2px; }
  html[data-lang="te"] .who { font-weight: 700; line-height: 1.5; font-size: 1.55rem; }
  .about { color: var(--muted); font-size: .92rem; margin-top: 4px; }
  .par { margin-top: 18px; padding-top: 16px; border-top: 1px dashed var(--rule); }
  .par small { display: block; color: var(--muted); font-size: .82rem; }
  .par b { display: block; font-weight: 500; font-size: 1.05rem; }
  .place { margin-top: 10px; color: var(--muted); font-size: .9rem; }
  .quote { text-align: center; font-family: var(--f-display); font-size: 1.35rem; line-height: 1.5; max-width: 30ch; margin: 38px auto 0; text-wrap: balance; }
  html[data-lang="te"] .quote { font-weight: 700; font-size: 1.15rem; line-height: 1.8; }

  /* ---------- Elders ---------- */
  .elder-photo { display: grid; justify-items: center; margin-top: 26px; text-align: center; }
  .fams { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 16px; margin-top: 30px; }
  .fam { background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 24px 20px; text-align: center; min-width: 0; }
  .fam .role { margin-top: 0; margin-bottom: 8px; }
  .fn { font-family: var(--f-display); font-size: 1.35rem; line-height: 1.3; }
  html[data-lang="te"] .fn { font-weight: 700; font-size: 1.15rem; line-height: 1.6; }

  /* ---------- Muhurtham ---------- */
  .muh { color: #3E0912; text-align: center; --sc: #E8A63A; background: linear-gradient(165deg, #F4CB68, #E8A63A); }
  .muh .rays { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
  .muh .rays::before { content: ""; position: absolute; inset: -60%; background: repeating-conic-gradient(from 0deg at 50% 38%, rgba(255,255,255,.2) 0 5deg, transparent 5deg 15deg); animation: spin 200s linear infinite; }
  .muh .wrap { position: relative; }
  .muh .eyebrow { color: #6A0F22; }
  .muh .lede { color: #5A1420; margin-inline: auto; }
  .om { position: relative; width: 150px; height: 150px; margin: 8px auto 6px; display: grid; place-items: center; }
  .om::before, .om::after { content: ""; position: absolute; border-radius: 50%; border: 1px solid rgba(106,15,34,.5); }
  .om::before { inset: 0; } .om::after { inset: 12px; border-style: dashed; }
  .om span { font-family: 'Noto Sans Devanagari', 'Gilda Display', serif; font-size: 4.6rem; line-height: 1; font-weight: 600; color: #6A0F22; }
  .bigdate { font-family: var(--f-display); font-size: clamp(1.6rem, 6vw, 2.3rem); line-height: 1.3; margin-top: 4px; }
  html[data-lang="te"] .bigdate { font-weight: 700; line-height: 1.5; }
  .bigtime { display: inline-block; margin-top: 10px; padding: 8px 22px; border-radius: 999px; background: #6A0F22; color: #F8E9D2; font-weight: 600; letter-spacing: .06em; }
  .muh .blessline { margin-top: 28px; font-family: var(--f-display); font-size: 1.2rem; }
  html[data-lang="te"] .muh .blessline { font-weight: 700; font-size: 1.05rem; line-height: 1.8; }

  /* ---------- Events ---------- */
  .dayhead { display: flex; align-items: center; gap: 12px; margin: 38px 0 14px; }
  .dayhead b { font-family: var(--f-display); font-weight: 400; font-size: 2.4rem; line-height: 1; color: var(--gold-ink); }
  .dayhead span { font-size: .85rem; font-weight: 600; color: var(--muted); }
  .dayhead i { flex: 1; height: 1px; background: var(--rule); }
  .evlist { display: grid; gap: 14px; }
  .ev { display: flex; gap: 16px; align-items: center; background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 14px 16px; }
  .ico { flex: 0 0 64px; width: 64px; height: 64px; border-radius: 50%; background: var(--wash); border: 1px solid var(--gold-ink); color: var(--gold-ink); display: grid; place-items: center; }
  .ico svg { width: 40px; height: 40px; }
  .evb { min-width: 0; }
  .evb .t { font-size: .85rem; font-weight: 600; letter-spacing: .04em; color: var(--gold-ink); font-variant-numeric: tabular-nums; }
  .evb h3 { font-family: var(--f-display); font-weight: 400; font-size: 1.3rem; line-height: 1.25; }
  html[data-lang="te"] .evb h3 { font-weight: 700; font-size: 1.15rem; line-height: 1.5; }
  .evb p.n { color: var(--muted); font-size: .93rem; margin-top: 3px; }
  .ev.feat { display: block; padding: 0; overflow: hidden; background: var(--hero); color: var(--on-hero); border-color: var(--hero); }
  .ev.feat .art svg { width: 100%; height: auto; }
  .ev.feat .evb { padding: 18px 20px 22px; }
  .ev.feat .evb .t { color: var(--gold); }
  .ev.feat .evb p.n { color: rgba(248,233,210,.85); }

  /* ---------- Location cards ---------- */
  .loc { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-top: 16px; padding: 16px 18px; border-radius: 10px; background: var(--wash); border: 1px dashed var(--gold-ink); }
  .loc .pin { flex: 0 0 40px; width: 40px; height: 40px; color: var(--gold-ink); }
  .loc .pin svg { width: 100%; height: 100%; }
  .loc .lb { flex: 1 1 200px; min-width: 0; }
  .loc small { display: block; font-size: .78rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--gold-ink); }
  html[data-lang="te"] .loc small { letter-spacing: 0; text-transform: none; font-size: .88rem; }
  .loc b { display: block; font-family: var(--f-display); font-weight: 400; font-size: 1.3rem; line-height: 1.3; }
  html[data-lang="te"] .loc b { font-weight: 700; font-size: 1.15rem; line-height: 1.6; }

  /* ---------- Closing ---------- */
  .foot { position: relative; text-align: center; color: var(--on-hero); background: radial-gradient(ellipse at 50% 30%, var(--hero-glow) 0, transparent 70%), var(--hero); padding-block: 84px 60px; --sc: var(--hero); }
  .foot::before { content: ""; position: absolute; left: 0; right: 0; bottom: 100%; height: 14px; background: radial-gradient(circle at 50% 100%, var(--hero) 0 8.5px, transparent 9px) 0 0 / 22px 14px repeat-x; }
  .foot .mandala-bg svg { width: min(620px, 150vw); opacity: .16; }
  .foot .wrap { position: relative; }
  .foot .names .n { font-size: clamp(2.6rem, 12vw, 4.6rem); }
  html[data-lang="te"] .foot .names .n { font-size: clamp(2.3rem, 10vw, 3.6rem); }
  .foot .fd { margin-top: 12px; color: var(--gold); font-weight: 500; letter-spacing: .05em; }
  .foot .thanks { font-family: var(--f-display); font-size: 1.4rem; line-height: 1.45; max-width: 24ch; margin: 28px auto 0; text-wrap: balance; }
  html[data-lang="te"] .foot .thanks { font-weight: 700; font-size: 1.2rem; line-height: 1.8; }
  .foot .bl { margin: 14px auto 0; max-width: 40ch; opacity: .85; }
  .foot .sign { margin-top: 18px; color: var(--gold); font-weight: 500; }
  .foot .copy { margin-top: 30px; font-size: .78rem; opacity: .6; }

  @media (prefers-reduced-motion: reduce) {
    .petals { display: none; }
    .mandala-bg svg, .muh .rays::before, .flame, .bulb, .swipe svg { animation: none; }
    html { scroll-behavior: auto; }
  }
</style>
<style>html{-webkit-text-size-adjust:100%}body{margin:0}</style>

<body>

<header class="top">
  <div class="wrap">
    <div class="top-in">
      <span class="mono" id="mono"></span>
      <div class="lang" role="group" aria-label="Language / భాష">
        <button type="button" data-l="en" id="b-en" aria-pressed="true">English</button>
        <button type="button" data-l="te" id="b-te" aria-pressed="false" lang="te">తెలుగు</button>
      </div>
    </div>
    <nav class="nav" id="nav" aria-label="Sections"></nav>
  </div>
</header>

<main id="app"></main>

<script>
/* ==================================================================
   EDIT HERE. All visible words live in CONFIG, in English (en) and
   Telugu (te). Details are SAMPLES. The five Panchangam fields in
   `muhurtham` are placeholders: replace them with your priest's values.
   Photos: leave empty to show illustrated placeholders, or set a path
   published with the page / a data: URI. Set allowAddPhotos to false
   for the final invitation, so guests do not see "Add photo" buttons.
   ================================================================== */
const CONFIG = {
  defaultLang: 'en',
  allowAddPhotos: false,
  bride: { en: 'Sowmya', te: 'సౌమ్య' },

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const R = Math.PI / 180;
const r1 = (n) => Math.round(n * 10) / 10;
const parts = (iso) => { const [y, m, d] = iso.split('-').map(Number); return { y, m: m - 1, d, wd: new Date(Date.UTC(y, m - 1, d)).getUTCDay() }; };
const longDate = (iso) => { const p = parts(iso); return `${WEEK[lang][p.wd]}, ${p.d} ${MONTHS[lang][p.m]} ${p.y}`; };
const reduceMotion = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ==================== Illustration kit (inline SVG) ==================== */
function mandalaBody() {
  let s = '';
  for (let i = 0; i < 36; i++) { const a = i * 10 * R; s += `<circle cx="${r1(200 + 190 * Math.cos(a))}" cy="${r1(200 + 190 * Math.sin(a))}" r="2.2" fill="currentColor" stroke="none"/>`; }
  s += '<circle cx="200" cy="200" r="176"/><circle cx="200" cy="200" r="170"/>';
  for (let i = 0; i < 24; i++) s += `<ellipse cx="200" cy="60" rx="10" ry="28" transform="rotate(${i * 15} 200 200)"/>`;
  s += '<circle cx="200" cy="200" r="112"/>';
  for (let i = 0; i < 12; i++) s += `<path d="M200 90 Q218 126 200 152 Q182 126 200 90Z" transform="rotate(${i * 30} 200 200)"/>`;
  for (let i = 0; i < 12; i++) s += `<path d="M200 118 Q208 136 200 148 Q192 136 200 118Z" fill="currentColor" fill-opacity=".35" transform="rotate(${i * 30 + 15} 200 200)"/>`;
  s += '<circle cx="200" cy="200" r="52"/>';
  let pts = ''; for (let i = 0; i < 16; i++) { const r = i % 2 ? 22 : 44, a = (i * 22.5 - 90) * R; pts += `${r1(200 + r * Math.cos(a))},${r1(200 + r * Math.sin(a))} `; }
  s += `<polygon points="${pts}"/><circle cx="200" cy="200" r="8" fill="currentColor"/>`;
  return s;
}

function toran() {
  const W = 800, N = 8, seg = W / N, sag = 40; let s = '';
  for (let i = 0; i < N; i++) {
    const x0 = i * seg, x1 = x0 + seg, cx = x0 + seg / 2;
    const pt = (u) => [(1 - u) * (1 - u) * x0 + 2 * (1 - u) * u * cx + u * u * x1, (1 - u) * (1 - u) * 6 + 2 * (1 - u) * u * (6 + 2 * sag) + u * u * 6];
    s += `<path d="M${x0} 6 Q${cx} ${6 + 2 * sag} ${x1} 6" fill="none" class="s-gold" stroke-width="1.5"/>`;
    for (let k = 2; k <= 8; k += 2) { const [x, y] = pt(k / 10); s += `<path class="f-leaf" d="M${r1(x)} ${r1(y)} q-9 14 0 30 q9 -16 0 -30z"/>`; }
    for (let k = 1; k <= 9; k++) { const [x, y] = pt(k / 10); s += `<circle class="f-mar" cx="${r1(x)}" cy="${r1(y)}" r="4.8"/><circle class="f-mard" cx="${r1(x)}" cy="${r1(y)}" r="1.8"/>`; }

}

function garland(x0, y0, cx, cy, x1, y1, n, c1, c2) {

    const x = (1 - u) * (1 - u) * x0 + 2 * (1 - u) * u * cx + u * u * x1;

const fallbacks = {};

function slotHtml(key, fallback) {
  fallbacks[key] = fallback;
  const src = photoFor(key), add = CONFIG.allowAddPhotos;
  const inner = src ? `<img src="${esc(src)}" alt="" loading="lazy">` : `<div class="ph">${fallback}</div>`;
  let ctrl = '';
  if (add) {
    ctrl = !src
      ? `<label class="addp"><input type="file" accept="image/*" data-k="${key}" aria-label="${esc(t(UI.addPhoto))}"><span>+ ${esc(t(UI.addPhoto))}</span></label>`
      : (userPhotos[key] ? `<button class="rm" type="button" data-rm="${key}" aria-label="${esc(t(UI.rmPhoto))}">×</button>` : '');
  }
  return `<div class="slot" data-slot="${key}">${inner}${ctrl}</div>`;
}
function refreshSlot(key) {
  const el = document.querySelector(`.slot[data-slot="${key}"]`);
  if (!el) return;
  const tmp = document.createElement('div');
  tmp.innerHTML = slotHtml(key, fallbacks[key]);
  el.replaceWith(tmp.firstChild);
}
function savePhotos() { try { localStorage.setItem('subhalekha-photos', JSON.stringify(userPhotos)); } catch (e) {} }
function shrink(file) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onerror = rej;
    fr.onload = () => {
      const im = new Image();
      im.onerror = rej;
      im.onload = () => {
        const sc = Math.min(1, 1000 / Math.max(im.width, im.height));
        const c = document.createElement('canvas');
        c.width = Math.round(im.width * sc); c.height = Math.round(im.height * sc);
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', 0.8));
      };
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}
document.addEventListener('change', async (e) => {
  const inp = e.target;
  if (!(inp instanceof HTMLInputElement) || inp.type !== 'file' || !inp.dataset.k || !inp.files[0]) return;
  try { userPhotos[inp.dataset.k] = await shrink(inp.files[0]); savePhotos(); refreshSlot(inp.dataset.k); } catch (err) {}
});
document.addEventListener('click', (e) => {
  const b = e.target.closest ? e.target.closest('[data-rm]') : null;
  if (!b) return;
  delete userPhotos[b.dataset.rm]; savePhotos(); refreshSlot(b.dataset.rm);
});

  days.sort((a, b) => (a.date < b.date ? -1 : 1));

    const p = parts(g.date);

      ? `<div class="loc"><div class="pin">${ICONS.pin}</div><div class="lb"><small>${esc(t(L.label))}</small><b>${esc(t(L.name))}</b></div><a class="btn solid" href="${esc(L.link)}" target="_blank" rel="noopener">${esc(t(UI.maps))}</a></div>`
      : '';
    return `<div class="dayhead"><b>${p.d}</b><span>${esc(mo)} · ${esc(wd)}</span><i></i></div><div class="evlist">${items}</div>${locCard}`;
  }).join('');
  return `<section class="scene pad" id="events"><div class="wrap">
    <div class="head-c"><p class="eyebrow">${esc(t(UI.evEye))}</p><h2>${esc(t(UI.evH))}</h2></div>
    ${body}
  </div></section>`;
}

function footHtml() {
  const c = CONFIG;
  return `<footer class="foot">
    <div class="mandala-bg">${mandala()}</div>
    <div class="wrap">
      <h2 class="names"><span class="n">${esc(t(c.groom))}</span><span class="amp">&amp;</span><span class="n">${esc(t(c.bride))}</span></h2>
      <p class="fd">${esc(longDate(c.weddingDate))}</p>
      <p class="thanks">${esc(t(c.closing.thanks))}</p>
      <p class="bl">${esc(t(c.closing.bless))}</p>
      <p class="sign">${esc(t(c.closing.sign))}</p>
      <p class="copy">© ${parts(c.weddingDate).y}</p>
    </div>
  </footer>`;
}

/* ==================== Behaviour ==================== */
function goTo(id) { const el = $(id); if (el) el.scrollIntoView({ behavior: reduceMotion() ? 'auto' : 'smooth', block: 'start' }); }

let io = null;
function wire() {
  document.querySelectorAll('[data-go]').forEach((b) => b.addEventListener('click', () => goTo(b.dataset.go)));
  document.querySelectorAll('[data-rail]').forEach((b) => b.addEventListener('click', () => {
    const r = $(b.dataset.rail), card = r.firstElementChild;
    r.scrollBy({ left: Number(b.dataset.dir) * (card.getBoundingClientRect().width + 16), behavior: reduceMotion() ? 'auto' : 'smooth' });
  }));
  if (io) io.disconnect();
  if ('IntersectionObserver' in window) {
    io = new IntersectionObserver((entries) => {
      entries.forEach((en) => {
        if (!en.isIntersecting) return;
        const map = { hero: 'hero', couple: 'couple', elders: 'couple', muhurtham: 'events', events: 'events' };
        const key = map[en.target.id];
        const nav = $('nav');
        nav.querySelectorAll('button').forEach((b) => {
          const on = b.dataset.go === key;
          b.setAttribute('aria-current', on ? 'true' : 'false');
          if (on) nav.scrollTo({ left: b.offsetLeft - nav.clientWidth / 2 + b.clientWidth / 2, behavior: 'smooth' });
        });
      });
    }, { rootMargin: '-40% 0px -55% 0px' });
    ['hero', 'couple', 'elders', 'muhurtham', 'events'].forEach((id) => { const el = $(id); if (el) io.observe(el); });
  }
}

function render() {
  const c = CONFIG, root = document.documentElement;
  root.lang = lang; root.dataset.lang = lang;
  $('b-en').setAttribute('aria-pressed', String(lang === 'en'));
  $('b-te').setAttribute('aria-pressed', String(lang === 'te'));
  document.title = `${c.groom.en} & ${c.bride.en} · ${lang === 'te' ? 'వివాహ ఆహ్వానం' : 'Wedding Invitation'}`;
  $('mono').textContent = `${c.groom.en[0]} & ${c.bride.en[0]}`;
  $('nav').innerHTML = [['hero', UI.nHome], ['couple', UI.nCouple], ['events', UI.nEvents]]
    .map(([id, l]) => `<button type="button" data-go="${id}" aria-current="false">${esc(t(l))}</button>`).join('');
  $('app').innerHTML = heroHtml() + coupleHtml() + eldersHtml() + muhHtml() + eventsHtml() + footHtml();
  wire();
}

document.querySelectorAll('.lang button').forEach((b) => b.addEventListener('click', () => {
  lang = b.dataset.l;
  try { localStorage.setItem('subhalekha-lang', lang); } catch (e) {}
  render();
}));
render();
</script>
